<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen Builder</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d2330'/%3E%3Crect x='10' y='6' width='12' height='20' rx='3' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f6f7f9;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
      #boot {
        height: 100%;
        display: grid;
        place-items: center;
        color: #9aa1ad;
        font-size: 13px;
      }
      /* Drag ghost lives in the document so it can float above everything. */
      .wb-drag-ghost {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 1000;
        pointer-events: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-radius: 9px;
        background: #4f46e5;
        color: #fff;
        font: 600 12.5px system-ui, sans-serif;
        box-shadow: 0 10px 28px rgb(79 70 229 / 0.35);
        white-space: nowrap;
      }
      .wb-drag-ghost.no-drop {
        background: #1d2330;
        opacity: 0.85;
      }
      html.wb-dragging,
      html.wb-dragging * {
        cursor: grabbing !important;
        user-select: none !important;
      }
    </style>
  </head>
  <body>
    <div id="boot">Loading Screen Builder…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
